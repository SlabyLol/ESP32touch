; ESP32-2432S032 – ST7789, BL=GPIO27
; Working config from community (TFT_SDA_READ, 27 MHz, no USE_HSPI)

[platformio]
default_envs = s032_st7789

[env]
; WICHTIG: Versionen fest pinnen. Mit unpinned "espressif32" wird automatisch der
; neue Arduino-Core 3.x geladen, mit dem TFT_eSPI haeufig nur noch schwarzen Screen zeigt.
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43

; gemeinsame Display-Config
[display_common]
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_SDA_READ=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000

; Minimal Display-Test (nur Farben, kein PIN/SD)
[env:s032_test]
build_src_filter = -<*> +<display_test.cpp>
build_flags =
    ${display_common.build_flags}

; Vollfirmware (nur main.cpp, sonst doppelte setup()/loop() mit display_test.cpp!)
[env:s032_st7789]
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${display_common.build_flags}
    -D TFT_MISO=12
    -D TOUCH_CS=33
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D TFT_BL_PIN=27

; Vollfirmware mit invertierten Farben
[env:s032_st7789_inv]
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${display_common.build_flags}
    -D TFT_MISO=12
    -D TOUCH_CS=33
    -D TFT_INVERSION_ON=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D TFT_BL_PIN=27

; Touch kalibrieren: flashen, Ecken beruehren, Werte aus Serial Monitor in main.cpp eintragen
[env:s032_calibrate]
build_src_filter = -<*> +<touch_calibrate.cpp>
build_flags =
    ${display_common.build_flags}
    -D TFT_MISO=12
    -D TOUCH_CS=33

; Backlight-Pin-Suche: schaltet GPIOs nacheinander ein, Serial zeigt welcher
[env:s032_bltest]
build_src_filter = -<*> +<bltest.cpp>
