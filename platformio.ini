; DarkFox ESP32touch – CYD / gelbes Board
; BL Standard = GPIO 21

[platformio]
default_envs = cyd_st7789_inv

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D USE_HSPI_PORT=1

; ST7789 + Inversion (viele 2-USB / neuere gelbe Boards)
[env:cyd_st7789_inv]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

; ST7789 ohne Inversion
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR

; ILI9341 Standard
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR

; ILI9341 + Inversion
[env:cyd_ili9341_inv]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

; Backlight aktiv LOW (manche Boards)
[env:cyd_st7789_inv_bl_low]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_BACKLIGHT_ON=LOW
