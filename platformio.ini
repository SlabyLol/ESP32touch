; DarkFox ESP32touch – gelbes Board / CYD-kompatibel
; Standard: Backlight GPIO 21 (nicht 27!)

[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D USE_HSPI_PORT=1

; Häufigstes gelbes Board (ESP32-2432S028): ILI9341 + BL=21
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR

; Variante mit ST7789 (manche 2-USB Boards)
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR

; Alte Config (nur wenn du wirklich BL an GPIO 27 hast)
[env:legacy_bl27]
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=35
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D USE_HSPI_PORT=1
