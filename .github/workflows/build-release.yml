name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python tools/pack_homebrew.py --build
          test -n "$(ls -A homebrew/out/*.hb 2>/dev/null)" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-hb
          path: homebrew/out/*.hb
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build all display variants
        run: |
          pio run -e cyd_st7789_inv
          pio run -e cyd_st7789
          pio run -e cyd_ili9341
          pio run -e cyd_ili9341_inv
          pio run -e cyd_st7789_inv_bl_low
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-cyd
          path: |
            .pio/build/cyd_st7789_inv/firmware.bin
            .pio/build/cyd_st7789/firmware.bin
            .pio/build/cyd_ili9341/firmware.bin
            .pio/build/cyd_ili9341_inv/firmware.bin
            .pio/build/cyd_st7789_inv_bl_low/firmware.bin

  release:
    needs: [homebrew, firmware]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.homebrew.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-hb
          path: dist/hb
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firmware-cyd
          path: dist/fw
      - name: Pack release files
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d-%H%M)
          VERSION="v${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          mkdir -p dist/out dist/homebrew
          cp dist/hb/*.hb dist/homebrew/ 2>/dev/null || true
          cd dist && zip -r "out/homebrew-${VERSION}.zip" homebrew || true
          # Flatten whatever layout artifacts use
          find fw -name 'firmware.bin' 2>/dev/null | while read f; do
            dir=$(basename $(dirname "$f"))
            cp "$f" "out/ESP32touch-${VERSION}-${dir}.bin"
          done
          ls -la out/ || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Welche .bin?
            1. `*-cyd_st7789_inv.bin` ← **zuerst** (ST7789 + Inversion)
            2. `*-cyd_st7789.bin`
            3. `*-cyd_ili9341.bin`
            4. `*-cyd_ili9341_inv.bin`
            5. `*-cyd_st7789_inv_bl_low.bin` (Backlight LOW)

            Flash mit Arduino IDE Upload oder esptool. USB-Kabel mit Datenleitung, nicht nur Laden.
          files: |
            dist/out/*
            dist/homebrew/*.hb
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
