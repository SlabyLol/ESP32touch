name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python tools/pack_homebrew.py --build
          test -n "$(ls -A homebrew/out/*.hb 2>/dev/null)" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-hb
          path: homebrew/out/*.hb

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -U platformio
          pio run -e s032_test
          pio run -e s032_st7789
          pio run -e s032_st7789_inv
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-s032
          path: |
            .pio/build/s032_test/firmware.bin
            .pio/build/s032_st7789/firmware.bin
            .pio/build/s032_st7789_inv/firmware.bin

  release:
    needs: [homebrew, firmware]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.homebrew.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-hb
          path: dist/hb
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firmware-s032
          path: dist/fw
      - id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d-%H%M)
          VERSION="v${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          mkdir -p dist/out dist/homebrew
          cp dist/hb/*.hb dist/homebrew/ 2>/dev/null || true
          cd dist && zip -r "out/homebrew-${VERSION}.zip" homebrew || true
          find fw -name 'firmware.bin' 2>/dev/null | while read f; do
            dir=$(basename $(dirname "$f"))
            cp "$f" "out/ESP32touch-${VERSION}-${dir}.bin"
          done
          ls -la out/ || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## ESP32-2432S032

            **Zuerst Display-Test flashen:**
            `*-s032_test.bin` → muss Rot/Grün/Blau + "DarkFox OK" zeigen

            Dann Vollfirmware:
            `*-s032_st7789.bin`

            Config: ST7789, BL=27, TFT_SDA_READ, 27MHz, kein USE_HSPI
          files: |
            dist/out/*
            dist/homebrew/*.hb
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
