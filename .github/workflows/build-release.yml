name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homebrew:
    name: Build HomeBrew (.py/.cpp/.cs -> .hb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack all HomeBrew sources
        run: |
          python tools/pack_homebrew.py --build
          echo "--- built files ---"
          ls -la homebrew/out/
          test -n "$(ls -A homebrew/out/*.hb 2>/dev/null)" || (echo "Keine .hb gebaut" && exit 1)

      - name: Upload .hb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-hb
          path: homebrew/out/*.hb
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
          retention-days: 30

  release:
    name: Release
    needs: [homebrew, firmware]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.homebrew.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download HomeBrew
        uses: actions/download-artifact@v4
        with:
          name: homebrew-hb
          path: dist/hb

      - name: Download firmware (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: dist

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d-%H%M)
          VERSION="v${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          mkdir -p dist/homebrew
          cp dist/hb/*.hb dist/homebrew/
          cd dist && zip -r "homebrew-${VERSION}.zip" homebrew
          ls -la homebrew/
          if [ -f firmware.bin ]; then
            mv firmware.bin "ESP32touch-${VERSION}.bin"
            mv firmware.elf "ESP32touch-${VERSION}.elf"
            echo "has_fw=true" >> $GITHUB_OUTPUT
          else
            echo "has_fw=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            dist/homebrew-${{ steps.version.outputs.version }}.zip
            dist/homebrew/*.hb
            dist/ESP32touch-${{ steps.version.outputs.version }}.bin
            dist/ESP32touch-${{ steps.version.outputs.version }}.elf
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
